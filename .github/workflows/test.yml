name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (mock mode)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show registered routes (sanity check)
        run: python -c "from backend.main import app; print(f'{len(app.routes)} routes registered')"
        env:
          LLM_PROVIDER: mock

      - name: Run tests
        run: pytest -v
        env:
          LLM_PROVIDER: mock
          # 真实 LLM 测试默认被 pytest.ini 的 addopts 过滤，双保险
          DEEPSEEK_API_KEY: ""
